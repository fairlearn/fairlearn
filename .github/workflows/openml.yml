name: OpenML tests

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
      - "release/**"
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: openml-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DATA_HOME: "~/openml_data"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Cache OpenML datasets
        uses: actions/cache@v4
        with:
          path: ${{ env.DATA_HOME }}
          key: ${{ runner.os }}-openml-datasets-v1
          restore-keys: ${{ runner.os }}-openml-datasets-
      - run: python scripts/install_requirements.py
      - run: pip install .
      - run: pytest -m openml -vl test/

  other-ml:
    strategy:
      fail-fast: false
      matrix:
        mlpackage: [lightgbm, xgboost, tensorflow, pytorch]
    uses: ./.github/workflows/test-other-ml.yml
    with:
      os: ubuntu-latest
      python: "3.13"
      mlpackage: ${{ matrix.mlpackage }}
      optional: ${{ github.event_name == 'pull_request' }}
