name: linting

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python:
        required: true
        type: string

jobs:
  ruff:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.15.20
  ruff-format:
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: 0.15.20
          args: "format --check --diff"
  build-wheel:
    runs-on: ${{ inputs.os }}
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - uses: astral-sh/setup-uv@v10.3.0
    - name: Install build tooling
      run: uv sync --locked --python python --no-default-groups --group tooling
    - name: Build sdist and wheel
      run: uv run --locked --python python --no-default-groups --group tooling python -m build
