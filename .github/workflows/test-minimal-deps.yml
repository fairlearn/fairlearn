name: test-minimal-deps

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python:
        required: true
        type: string
      codeCovPython:
        required: true
        type: string

jobs:
  minimal-deps:
    # This job installs minimal dependencies and runs tests for the minimal
    # dependency cases. This also covers the case where matplotlib is not
    # installed, i.e., fairlearn without extras.
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python }}
      - run: pip install .
      - run: pip install pytest pytest-cov
      - run: pytest --cov=fairlearn --cov-report=xml test/install
      - name: Retain coverage report
        if: ${{ inputs.codeCovPython == inputs.python }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-line-install-${{ inputs.os }}-${{ inputs.python }}
          path: |
            .coverage
            coverage.xml
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
