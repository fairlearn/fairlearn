name: Release Wheel

# Following will be changed in due course
on:
  workflow_dispatch:


concurrency:
  # this ensures after each commit the old jobs are cancelled and the new ones
  # run instead.
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  VERSION_FILE_NAME: version.txt
  WHEEL_ARTIFACT: fairlearn-wheels

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"
    - name: Update pip and build
      run: |
        pip install --upgrade pip
        pip install --upgrade build
    - name: Build wheels
      run: python ./scripts/build_wheels.py --version-filename $VERSION_FILE_NAME
    - name: Save wheels to artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.WHEEL_ARTIFACT }}
        path: dist/

  test-wheel:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-14]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }} on ${{ matrix.os }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.0
    - name: Remove Fairlearn source directory
      uses: JesseTG/rm@v1.0.3
      with:
        path: fairlearn
    - name: Download wheel artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.WHEEL_ARTIFACT }}
    - name: Install Fairlearn from wheel
      shell: bash
      run: |
        uv pip install --system --python python --prerelease disallow ./fairlearn-*.whl
    - name: Install testing requirements
      run: |
        uv pip install --system --python python --prerelease disallow pytest pytest-mock pytest-mpl lightgbm -c requirements-dev.txt
    - name: Verify wheel installation and stable dependencies
      shell: bash
      run: |
        python - <<'PY'
        import json
        from importlib.metadata import distribution, distributions
        from pathlib import Path
        from zipfile import ZipFile

        import fairlearn
        from packaging.version import Version

        wheel, = Path.cwd().glob("fairlearn-*.whl")
        installed = distribution("fairlearn")
        direct_url = json.loads(installed.read_text("direct_url.json"))
        assert direct_url["url"] == wheel.as_uri(), direct_url
        with ZipFile(wheel) as archive:
            for name in archive.namelist():
                if name.startswith("fairlearn/") and not name.endswith("/"):
                    assert archive.read(name) == installed.locate_file(name).read_bytes(), name
        assert Path(fairlearn.__file__).resolve() == Path(installed.locate_file("fairlearn/__init__.py")).resolve()
        assert fairlearn.__version__ == Path("version.txt").read_text().strip()
        for dependency in distributions():
            version = Version(dependency.version)
            assert not version.is_prerelease, (dependency.metadata["Name"], dependency.version)
        print(f"Testing {wheel.name} from {fairlearn.__file__} with stable dependencies")
        PY
    - name: Run tests
      run: >
        pytest --mpl
        --mpl-baseline-path='${{ github.workspace }}/test/unit/plot_snapshots'
        --ignore=test/install test/

  release-wheel:
    needs: test-wheel
    runs-on: ubuntu-latest
    steps:
    - name: Download wheel artifact
      uses: actions/download-artifact@v8
      with:
        name: ${{ env.WHEEL_ARTIFACT }}
        path: dist
    - name: DEBUG
      run: ls -R
    # See
    # https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
    #- name: Release to Test-PyPI
    #  if: inputs.use_test_pypi
    #  uses: pypa/gh-action-pypi-publish@release/v1
    #  with:
    #    password: ${{ secrets.TEST_PYPI_API_TOKEN }}
    #    repository_url: https://test.pypi.org/legacy/
    - name: Release to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
