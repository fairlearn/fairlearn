name: test-other-ml

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python:
        required: true
        type: string
      mlpackage:
        required: true
        type: string

jobs:
  other-ml:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      baseDir: test_othermlpackages
      condaEnv: test-conda-env
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python }}
      - name: Get commit date
        id: get_date
        shell: bash
        run: |
          COMMIT_DATE=$(git show -s --format=%ct ${{ github.sha }})
          CURRENT_DATE=$(date +%s)
          AGE=$((CURRENT_DATE - COMMIT_DATE))
          echo "AGE=$AGE" >> $GITHUB_OUTPUT
          echo "AGE in seconds: $AGE"
      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: latest
          activate-environment: ${{ env.condaEnv }}
          # Let each environment file choose its compatible Python version.
          environment-file: ${{ env.baseDir }}/conda-${{ inputs.mlpackage }}.yaml
          auto-activate: false
      - run: |
          if [[ ${{ inputs.mlpackage }} == "tensorflow" ]]; then
            export NUMPY_DEP="numpy<2"
          else
            export NUMPY_DEP="numpy"
          fi
          if [[ ${{ inputs.mlpackage }} == "lightgbm" ]]; then
            export NUMPY_DEP="numpy<2"
          else
            export NUMPY_DEP="numpy"
          fi
          pip install . $NUMPY_DEP
        name: Install Fairlearn
      - run: |
          echo
          conda list
          echo
          # Override the filterwarnings set in the TOML file
          python -v -m pytest -o filterwarnings=default --cov=fairlearn --cov-report=xml $baseDir/test_${{inputs.mlpackage}}.py
        name: Run ${{ inputs.mlpackage }} tests
      - name: Upload coverage reports to Codecov with GitHub Action
        if: ${{ steps.get_date.outputs.AGE < 172800 }} # 172800 = 48 * 3600
        uses: codecov/codecov-action@v7
        with:
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          verbose: true
