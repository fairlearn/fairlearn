name: test-all-deps

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python:
        required: true
        type: string
      codeCovPython:
        required: true
        type: string
      sklearnNightly:
        required: false
        type: boolean
        default: false

jobs:
  all-deps:
    # This job installs all dependencies and runs most tests.
    # CodeCov limits us to 150 uploads per commit id, so have an extra check so
    # we only upload results if the current commit is under 48 hours old
    runs-on: ${{ inputs.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - name: Get commit date
        id: get_date
        shell: bash
        run: |
          COMMIT_DATE=$(git show -s --format=%ct ${{ github.sha }})
          CURRENT_DATE=$(date +%s)
          AGE=$((CURRENT_DATE - COMMIT_DATE))
          echo "AGE=$AGE" >> $GITHUB_OUTPUT
          echo "AGE in seconds: $AGE"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python }}
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv venv --python python .venv-compat
      - run: uv pip install --python .venv-compat . --group tests --prerelease disallow
      - name: Install scikit-learn nightly build
        if: ${{ inputs.sklearnNightly }}
        run: >
          uv pip install --python .venv-compat --upgrade --prerelease allow --index
          https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
          --index-strategy unsafe-best-match
          scikit-learn
      - if: ${{ inputs.sklearnNightly }}
        run: uv run --no-project --python .venv-compat python -c "import sklearn; assert '.dev' in sklearn.__version__, sklearn.__version__"
      - run: >
          uv run --no-project --python .venv-compat python -m pytest --mpl
          --mpl-baseline-path='${{ github.workspace }}/test/unit/plot_snapshots'
          --ignore=test/install -m "not openml"
          --cov=fairlearn --cov-report=xml -vl test/
      - name: Upload coverage reports to Codecov with GitHub Action
        if: ${{ (inputs.codeCovPython == inputs.python) && (steps.get_date.outputs.AGE < 172800) }} # 172800 = 48 * 3600
        uses: codecov/codecov-action@v7
        with:
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          verbose: true
