name: test-all-deps

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python:
        required: true
        type: string
      codeCovPython:
        required: true
        type: string
      sklearnNightly:
        required: false
        type: boolean
        default: false
      coverageBranch:
        required: false
        type: boolean
        default: false

jobs:
  all-deps:
    # This job installs all dependencies and runs most tests.
    runs-on: ${{ inputs.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python }}
      - run: python scripts/install_requirements.py
      - run: pip install .
      - name: Install scikit-learn nightly build
        if: ${{ inputs.sklearnNightly }}
        run: >
          pip install --upgrade --pre --extra-index
          https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
          scikit-learn
      - if: ${{ inputs.sklearnNightly }}
        run: python -c "import sklearn; assert '.dev' in sklearn.__version__, sklearn.__version__"
      - run: pip install matplotlib
      - run: >
          pytest --mpl
          --mpl-baseline-path='${{ github.workspace }}/test/unit/plot_snapshots'
          --ignore=test/install -m "not openml"
          --cov=fairlearn ${{ inputs.coverageBranch && '--cov-branch' || '' }}
          --cov-report=xml --cov-report=json --cov-report=term -vl test/
      - name: Retain coverage report
        if: ${{ inputs.codeCovPython == inputs.python }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.coverageBranch && 'branch' || 'line' }}-full-${{ inputs.os }}-${{ inputs.python }}
          path: |
            .coverage
            coverage.xml
            coverage.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
