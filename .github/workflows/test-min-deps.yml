name: test-all-deps-min

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python:
        required: true
        type: string
      codeCovPython:
        required: true
        type: string

jobs:
  all-deps-min:
    # This job installs all dependencies and runs most tests.
    runs-on: ${{ inputs.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python }}
      - run: python scripts/install_requirements.py --min
      - run: pip install .
      - run: pip install matplotlib
      - run: >
          pytest --mpl
          --mpl-baseline-path='${{ github.workspace }}/test/unit/plot_snapshots'
          --ignore=test/install -m "not openml"
          --cov=fairlearn --cov-report=xml -vl test/
      - name: Retain coverage report
        if: ${{ inputs.codeCovPython == inputs.python }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-line-min-${{ inputs.os }}-${{ inputs.python }}
          path: |
            .coverage
            coverage.xml
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
